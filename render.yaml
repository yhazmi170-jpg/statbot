services:
  - type: web
    name: statbot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node dist/index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PREFIX
        value: m?
      - key: TZ
        value: UTC
