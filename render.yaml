services:
  - type: web
    name: statbot2
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: mkdir -p data && npx prisma db push && node dist/index.js
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        value: file:./data/statbot.db
      - key: NODE_ENV
        value: production
      - key: PREFIX
        value: "m?"
      - key: TZ
        value: UTC
